[project]
name = "aibl_research"
version = "0.1.0"
description = "Implementation of Adaptive Information-Balanced Loss for LLM fine-tuning."
authors = [{name = "ML Researcher", email = "researcher@example.com"}]
requires-python = ">=3.9"

dependencies = [
    "torch>=2.1.0",
    "transformers>=4.30.0",
    "datasets>=2.14.0",
    "peft>=0.6.0",
    "pyyaml>=6.0",
    "evaluate>=0.4.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.65.0",
    "accelerate>=0.23.0",
    "bitsandbytes>=0.41.0",
    "scipy>=1.11.0",
    "wandb>=0.15.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
